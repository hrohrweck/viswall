version: 2

paths-ignore:
  - ".*\\.tmpl$"
  - ".*dovecot-sql.*"

secret:
  ignored-matches:
    - name: "Dovecot template variable"
      match: "@@DB_PASS@@"
    - name: "Dovecot template variable (alt)"
      match: "password=@@DB_PASS@@"
    - name: "Mail-service test fake PEM fixture"
      match: "private_key_pem.*fake"

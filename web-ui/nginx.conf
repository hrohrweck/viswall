server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy.
    # Resolve api-gateway per-request via Docker's embedded DNS (127.0.0.11)
    # using a variable upstream. With a literal hostname in proxy_pass, nginx
    # caches the container IP at startup; when api-gateway is recreated with a
    # new IP the cached address becomes stale and every /api call 502s. The
    # variable + resolver forces re-resolution (valid=10s). ipv6=off pins us to
    # the IPv4 service address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api-gateway:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }
}

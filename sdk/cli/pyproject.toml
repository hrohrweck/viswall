[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viswall-cli"
version = "0.1.0"
description = "Command-line interface for Viswall distributed security appliance platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Viswall Team", email = "dev@viswall.io" }
]
keywords = ["viswall", "security", "firewall", "cli", "vpn", "mail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "viswall-sdk>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-httpx>=0.29.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/hrohrweck/viswall"
Documentation = "https://github.com/hrohrweck/viswall/tree/main/sdk/cli"
Repository = "https://github.com/hrohrweck/viswall"

[project.scripts]
viswall = "viswall_cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pin the rule set the SDK was written under; unpinned ruff versions
# (0.16+) expand defaults and turn toolchain drift into CI failures
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viswall-sdk"
version = "0.1.0"
description = "Python SDK for Viswall distributed security appliance platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Viswall Team", email = "dev@viswall.io" }
]
keywords = ["viswall", "security", "firewall", "vpn", "mail", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-httpx>=0.29.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "openapi-python-client>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/hrohrweck/viswall"
Documentation = "https://github.com/hrohrweck/viswall/tree/main/sdk/python"
Repository = "https://github.com/hrohrweck/viswall"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pin the rule set the SDK was written under; unpinned ruff versions
# (0.16+) expand defaults and turn toolchain drift into CI failures
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

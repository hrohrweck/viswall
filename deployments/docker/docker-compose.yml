services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viswall
      POSTGRES_PASSWORD: ${DB_PASSWORD:-viswall}
      POSTGRES_DB: viswall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viswall"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - viswall

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - viswall

  # API Gateway
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://viswall:${DB_PASSWORD:-viswall}@postgres/viswall
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    # No direct port binding — accessed via nginx reverse proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - viswall
    volumes:
      - ../../shared:/app/shared:ro

  # Web UI
  web-ui:
    build:
      context: ../..
      dockerfile: web-ui/Dockerfile
    environment:
      VITE_API_URL: /api/v1
    # No direct port binding — accessed via nginx reverse proxy
    depends_on:
      - api-gateway
    networks:
      - viswall

  # nginx Reverse Proxy (TLS termination)
  nginx:
    build:
      context: ../..
      dockerfile: deployments/docker/nginx/Dockerfile
    environment:
      SSL_MODE: ${SSL_MODE:-selfsigned}
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api-gateway
      - web-ui
      - sogo
    networks:
      - viswall

  # SOGo Groupware (CalDAV/CardDAV/ActiveSync)
  sogo:
    build:
      context: ../..
      dockerfile: services/sogo-service/Dockerfile
    environment:
      SOGO_DB_HOST: postgres
      SOGO_DB_NAME: viswall
      SOGO_DB_USER: viswall
      SOGO_DB_PASS: ${DB_PASSWORD:-viswall}
      SOGO_TIMEZONE: ${TZ:-UTC}
    # No direct port binding — accessed via nginx reverse proxy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viswall

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - viswall

  # Grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - viswall

  # Ollama LLM (local inference)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # No port binding — accessed internally by api-gateway
    environment:
      OLLAMA_HOST: ':11434'
    networks:
      - viswall
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # SERVICE AGENTS (optional — uncomment to run agents in docker-compose)
  # These agents normally run on individual viswall instances.
  # Enabling them here is useful for local development and integration testing.
  # WARNING: firewall-agent and vpn-agent require privileged mode and host
  # networking to manipulate system network settings.
  # ============================================================================


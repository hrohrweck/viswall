  #     - "53:53/udp"
  #     - "53:53/tcp"
  #     - "8082:8082"
  #   depends_on:
  #     - api-gateway

  # Ollama model pull (runs once on startup)
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Pulling qwen3.5:9b model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen3.5:9b\"}' &&
        echo 'Model pull complete.'
      "
    networks:
      - viswall
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  certbot_data:
  certbot_www:
  ollama_data:

networks:
  viswall:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${IPV6_SUBNET:-fd00:42::/64}

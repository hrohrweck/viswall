  #   networks:
  #     - viswall

  # firewall-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/firewall-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     - api-gateway

  # vpn-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/vpn-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #   depends_on:
  #     - api-gateway

  # dns-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/dns-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}

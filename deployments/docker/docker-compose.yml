name: viswall
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viswall
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: viswall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viswall"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - viswall
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - viswall
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://viswall:${DB_PASSWORD:?DB_PASSWORD is required}@postgres/viswall
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - viswall
    volumes:
      - ../../shared:/app/shared:ro
    restart: unless-stopped

  # Web UI
  web-ui:
    build:
      context: ../../web-ui
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api-gateway
    networks:
      - viswall
    restart: unless-stopped

  # nginx Reverse Proxy (TLS termination) — DISABLED (D3: integrate behind existing host nginx)
  nginx:
    profiles: ["disabled"]
    build:
      context: ../..
      dockerfile: deployments/docker/nginx/Dockerfile
    environment:
      SSL_MODE: ${SSL_MODE:-selfsigned}
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api-gateway
      - web-ui
      - sogo
    networks:
      - viswall

  # SOGo Groupware (CalDAV/CardDAV/ActiveSync)
  sogo:
    build:
      context: ../..
      dockerfile: services/sogo-service/Dockerfile
    environment:
      SOGO_DB_HOST: postgres
      SOGO_DB_NAME: viswall
      SOGO_DB_USER: viswall
      SOGO_DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}
      SOGO_TIMEZONE: ${TZ:-UTC}
      SOGO_SERVER_URL: ${SOGO_SERVER_URL:-mail.example.com}
    ports:
      - "127.0.0.1:20000:20000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viswall
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - viswall
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - viswall
    restart: unless-stopped

  # Ollama LLM (local inference)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # No port binding — accessed internally by api-gateway
    environment:
      OLLAMA_HOST: ':11434'
    networks:
      - viswall
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============================================================================
  # SERVICE AGENTS (optional — uncomment to run agents in docker-compose)
  # These agents normally run on individual viswall instances.
  # Enabling them here is useful for local development and integration testing.
  # WARNING: firewall-agent and vpn-agent require privileged mode and host
  # networking to manipulate system network settings.
  # ============================================================================

  # Mail service (Exim MTA + Dovecot IMAP/POP3/LMTP, Postgres-backed).
  # Under the "mail" profile so normal `up` does NOT bind mail ports while the
  # legacy exim container still runs. Cutover: docker compose --profile mail up -d mail-service
  mail-service:
    profiles: ["mail"]
    build:
      context: ../..
      dockerfile: services/mail-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: viswall
      DB_USER: viswall
      DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}
      EXIM_HOSTNAME: ${MAIL_HOSTNAME:?MAIL_HOSTNAME is required}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "143:143"
      - "993:993"
      - "995:995"
    volumes:
      - ${LETSENCRYPT_LIVE:?LETSENCRYPT_LIVE is required}/fullchain.pem:/viswall/certs/server.crt:ro
      - ${LETSENCRYPT_LIVE:?LETSENCRYPT_LIVE is required}/privkey.pem:/viswall/certs/server.key:ro
      - /opt/viswall/dkim:/opt/viswall/dkim-staging:ro
      - mail_data:/var/mail
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - viswall

  # firewall-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/firewall-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     - api-gateway

  # vpn-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/vpn-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #   depends_on:
  #     - api-gateway

  # dns-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/dns-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #     DNS_AGENT_ALLOW_COMMANDS: "true"
  #   ports:
  #     - "53:53/udp"
  #     - "53:53/tcp"
  #     - "8082:8082"
  #   depends_on:
  #     - api-gateway

  # dhcp-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/dhcp-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #     DHCP_AGENT_ALLOW_COMMANDS: "true"
  #   ports:
  #     - "67:67/udp"
  #     - "547:547/udp"
  #     - "8083:8083"
  #   depends_on:
  #     - api-gateway

  # Ollama model pull (runs once on startup)
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Pulling qwen3.5:9b model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen3.5:9b\"}' &&
        echo 'Model pull complete.'
      "
    networks:
      - viswall
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  certbot_data:
  certbot_www:
  ollama_data:
  mail_data:
    external: true
    name: viswall_mail_data

networks:
  viswall:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${IPV6_SUBNET:-fd00:42::/64}

  #     context: ../..
  #     dockerfile: services/mail-service/Dockerfile
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://viswall:${DB_PASSWORD:-viswall}@postgres/viswall
  #     REDIS_URL: redis://redis:6379/1
  #   privileged: true
  #   ports:
  #     - "25:25"
  #     - "465:465"
  #     - "587:587"
  #     - "143:143"
  #     - "993:993"
  #   networks:
  #     - viswall

  # firewall-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/firewall-service/Dockerfile
  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #   ports:
  #     - "8081:8081"

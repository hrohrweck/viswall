  #   privileged: true
  #   network_mode: host
  #   environment:
  #     GATEWAY_URL: http://api-gateway:8000
  #     INSTANCE_API_KEY: ${INSTANCE_API_KEY:-dev-key}
  #   depends_on:
  #     - api-gateway

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  viswall:
    driver: bridge

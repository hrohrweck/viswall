global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: /metrics

  - job_name: 'viswall-instances'
    file_sd_configs:
      - files:
        - /etc/prometheus/targets/*.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

---
# Example Ansible inventory for Viswall deployment
#
# Copy this file and customize for your environment.

dev:
  children:
    managers:
      hosts:
        manager-01:
          # Use hostnames (resolve via DNS) or IPv4/IPv6 addresses
          ansible_host: manager-01.local
          viswall_role: manager
    agents:
      hosts:
        edge-01:
          ansible_host: edge-01.local
          viswall_role: agent
          viswall_agent_type: firewall
        edge-02:
          ansible_host: edge-02.local
          viswall_role: agent
          viswall_agent_type: mail
        edge-03:
          ansible_host: edge-03.local
          viswall_role: agent
          viswall_agent_type: vpn

  vars:
    ansible_user: sysop
    ansible_python_interpreter: /usr/bin/python3

---
# Common variables for all Viswall nodes

# Version / source
viswall_version: main
viswall_repo_url: https://github.com/hrohrweck/viswall.git
viswall_install_dir: /opt/viswall

# Manager-specific settings
viswall_db_password: "{{ vault_db_password }}"  # REQUIRED — set via ansible-vault
viswall_jwt_secret: "{{ vault_jwt_secret }}"  # REQUIRED — set via ansible-vault
viswall_grafana_password: "{{ vault_grafana_password }}"  # REQUIRED — set via ansible-vault
viswall_cors_origins: "http://localhost:3000"

# Agent-specific settings
viswall_gateway_url: "http://manager-01:8000"
viswall_instance_api_key: "{{ vault_instance_api_key }}"  # REQUIRED — set via ansible-vault

# Docker settings
docker_compose_version: "v2.24.0"

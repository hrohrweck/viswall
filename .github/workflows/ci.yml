name: Viswall CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Tests
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viswall
          POSTGRES_PASSWORD: viswall
          POSTGRES_DB: viswall_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/api-gateway/requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://viswall:viswall@localhost/viswall_test
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key
        PYTHONPATH: ${{ github.workspace }}
      run: |
        cd services/api-gateway
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term --asyncio-mode=auto

    - name: Upload coverage
      # Best effort: a codecov outage must not fail the pipeline (v4 throws
      # on network errors even with fail_ci_if_error: false).
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./services/api-gateway/coverage.xml
        fail_ci_if_error: false

  # Frontend Tests
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: web-ui
      run: npm install

    - name: Run linter
      working-directory: web-ui
      run: npm run lint

    - name: Run type check
      working-directory: web-ui
      run: npm run type-check

    - name: Run tests
      working-directory: web-ui
      run: npm run test:ci

    - name: Build
      working-directory: web-ui
      run: npm run build

  # Integration Tests
  test-integration:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        cd deployments/docker
        cp .env.example .env
        docker compose up -d postgres redis
        sleep 10  # Wait for services

    - name: Run API integration tests
      run: |
        # Add integration tests here
        echo "Running integration tests..."

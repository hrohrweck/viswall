protocols = imap pop3 lmtp
listen = *, ::
log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = yes
ssl_cert = </etc/dovecot/ssl/server.crt
ssl_key = </etc/dovecot/ssl/server.key
ssl_min_protocol = TLSv1.2

disable_plaintext_auth = yes
auth_mechanisms = plain login

mail_location = maildir:/var/mail/vhosts/%d/%n/Maildir
mail_uid = 5000
mail_gid = 5000
mail_plugins = quota
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000

namespace inbox {
  inbox = yes
}

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Dedicated SASL socket for Exim (new name; does not clobber Dovecot's internal auth-client)
service auth {
  unix_listener auth-exim {
    mode = 0660
    user = Debian-exim
    group = Debian-exim
  }
}

# Grant Exim access to the LMTP delivery socket (override default listener by name)
service lmtp {
  unix_listener lmtp {
    mode = 0660
    user = Debian-exim
    group = Debian-exim
  }
}

protocol lmtp {
  postmaster_address = postmaster@localhost
  mail_plugins = $mail_plugins quota
}

protocol imap {
  mail_max_userip_connections = 50
  mail_plugins = $mail_plugins quota
}

plugin {
  quota = maildir:User quota
}

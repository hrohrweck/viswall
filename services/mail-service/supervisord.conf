[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autorestart=true
priority=10

[program:freshclam]
command=/usr/bin/freshclam -d --foreground=true
autorestart=true
priority=15

[program:clamd]
command=/bin/sh -c 'while [ ! -e /var/lib/clamav/daily.cvd ] && [ ! -e /var/lib/clamav/daily.cld ]; do sleep 5; done; exec /usr/sbin/clamd --foreground=true'
autorestart=true
startretries=30
startsecs=10
priority=20

[program:spamd]
command=/usr/sbin/spamd --nouser-config --max-children=5 --helper-home-dir=/var/lib/spamassassin --syslog=stderr
autorestart=true
priority=30

[program:dovecot]
command=/bin/sh -c 'rm -f /run/dovecot/auth-exim /run/dovecot/lmtp; exec /usr/sbin/dovecot -F'
autorestart=true
startretries=10
priority=40

[program:exim]
command=/usr/sbin/exim4 -bdf -q30m -C /etc/exim4/exim4.conf
autorestart=true
priority=50

[program:mailagent]
command=/usr/bin/python3 /opt/viswall/mail_agent.py
directory=/opt/viswall
autorestart=true
priority=60
